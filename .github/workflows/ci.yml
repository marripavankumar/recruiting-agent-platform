name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: rap
          POSTGRES_PASSWORD: rap
          POSTGRES_DB: rap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rap -d rap"
          --health-interval 5s
          --health-retries 10
    env:
      RAP_TEST_DATABASE_URL: postgresql://rap:rap@localhost:5432/rap
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply database migrations
        run: |
          for f in ../db/migrations/*.sql; do
            psql "$RAP_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
