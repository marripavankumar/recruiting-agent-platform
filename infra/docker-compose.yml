# Local development stack. The same images run on any cloud's container service
# (see docs/05_Environment_Setup_Plan.md). Pinned versions; upgrade deliberately.
name: recruiting-agent-platform

services:
  postgres:
    image: docker.io/library/postgres:16.6
    environment:
      POSTGRES_USER: rap
      POSTGRES_PASSWORD: rap
      POSTGRES_DB: rap
    ports:
      - "127.0.0.1:5432:5432"  # this machine only (IPv4 and IPv6 "localhost")
      - "[::1]:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied once, on first start of an empty volume.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rap -d rap"]
      interval: 5s
      retries: 10

  qdrant:
    image: docker.io/qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"  # Qdrant has no authentication: this machine only
      - "[::1]:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  # Original resume files (S3-compatible). SeaweedFS: MinIO no longer publishes images.
  # Local-only credentials in seaweedfs/s3.json, like the database's rap/rap.
  documents:
    image: docker.io/chrislusf/seaweedfs:4.55
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:8333:8333"  # S3 API, this machine only
      - "[::1]:8333:8333"
    volumes:
      - documents-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  n8n:
    image: docker.io/n8nio/n8n:1.72.1
    ports:
      - "127.0.0.1:5678:5678"
      - "[::1]:5678:5678"
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n

  # The platform itself: `podman compose -f infra/docker-compose.yml --profile app up --build`
  # (or `docker compose ...`).
  # Settings come from ../.env (copy .env.example); the values below only point the services
  # at each other. Sign-in defaults to the local demo users (RAP_AUTH_PROVIDER=dev): add
  # users to app_user first, or set the OIDC variables.
  # Ports listen on this machine only. RAP_BIND_ADDRESS=0.0.0.0 (in the shell) opens the web app
  # and API to the network: do that only with company sign-in, never with the demo sign-in,
  # which lets anyone choose to be the Administrator.
  api:
    profiles: [app]
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      RAP_STORAGE: postgres
      RAP_DATABASE_URL: postgresql://rap:rap@postgres:5432/rap
      RAP_QDRANT_URL: http://qdrant:6333
      RAP_VECTOR_STORE: qdrant  # shared and kept across restarts (in-memory is per process)
      RAP_DOCUMENT_STORES: '["s3"]'
      RAP_S3_ENDPOINT_URL: http://documents:8333
      RAP_S3_REGION: us-east-1
      RAP_SECRET_S3_ACCESS_KEY_ID: rap
      RAP_SECRET_S3_SECRET_ACCESS_KEY: rap-local-documents-secret
      RAP_PUBLIC_BASE_URL: ${RAP_PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "${RAP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
      - "[::1]:8000:8000"  # IPv6 "localhost"
    # Here as well as in the Dockerfile: Podman's default OCI image format drops HEALTHCHECK.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      start_period: 20s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    profiles: [app]
    build: ../backend
    command: ["python", "-m", "recruiting.scheduler"]
    env_file:
      - path: ../.env
        required: false
    environment:
      RAP_STORAGE: postgres
      RAP_DATABASE_URL: postgresql://rap:rap@postgres:5432/rap
      RAP_QDRANT_URL: http://qdrant:6333
      RAP_VECTOR_STORE: qdrant  # shared and kept across restarts (in-memory is per process)
      RAP_DOCUMENT_STORES: '["s3"]'
      RAP_S3_ENDPOINT_URL: http://documents:8333
      RAP_S3_REGION: us-east-1
      RAP_SECRET_S3_ACCESS_KEY_ID: rap
      RAP_SECRET_S3_SECRET_ACCESS_KEY: rap-local-documents-secret
      RAP_WEB_BASE_URL: ${RAP_WEB_BASE_URL:-http://localhost:3000}  # link in the reminder digest
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: [app]
    build: ../web
    environment:
      RAP_API_URL: http://api:8000
      RAP_WEB_AUTH: ${RAP_WEB_AUTH:-dev}
      RAP_WEB_BASE_URL: ${RAP_WEB_BASE_URL:-http://localhost:3000}
      RAP_OIDC_ISSUER: ${RAP_OIDC_ISSUER:-}
      RAP_OIDC_CLIENT_ID: ${RAP_OIDC_CLIENT_ID:-}
      RAP_OIDC_CLIENT_SECRET: ${RAP_OIDC_CLIENT_SECRET:-}
    ports:
      - "${RAP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
      - "[::1]:3000:3000"  # IPv6 "localhost"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/signin').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      start_period: 15s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

volumes:
  documents-data:
  postgres-data:
  qdrant-data:
  n8n-data:
